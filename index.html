<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытие приложения</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f4f9; color: #333; }
        .hidden { display: none !important; }
        .btn { display: inline-block; background-color: #007bff; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="desktop-warning" style="display:none; background: #ffeeba; padding: 20px; border-radius: 8px;">
        <h2>📱 Откройте ссылку с телефона</h2>
        <p>Приложение работает только на Android.</p>
    </div>

    <div id="mobile-content" style="display:none;">
        <h1>Открываем приложение...</h1>
        
        <div id="not-installed-msg" class="hidden" style="margin-top: 20px;">
            <p>Приложение не установлено.</p>
            <p>Сначала установите APK-файл.</p>
        </div>

        <div id="manual-open" class="hidden">
            <p>Если приложение не открылось автоматически, нажмите:</p>
            <a href="#" id="open-app-btn" class="btn">Открыть вручную</a>
        </div>
    </div>

    <script>
        // Берем код из параметров текущего URL (например, из ?code=TEST123)
        const urlParams = new URLSearchParams(window.location.search);
        const inviteCode = urlParams.get('code');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
            document.getElementById('mobile-content').style.display = 'block';
            
            if (inviteCode) {
                // Собираем ссылку для вызова приложения (тот же домен и тот же код)
                const appLink = `https://maxbenben.github.io/?code=${inviteCode}`;
                document.getElementById('open-app-btn').href = appLink;

                // Пробуем открыть приложение
                window.location.href = appLink;

                // Если приложение не установилось, показываем сообщение
                setTimeout(() => {
                    document.getElementById('not-installed-msg').classList.remove('hidden');
                    document.getElementById('manual-open').classList.remove('hidden');
                    document.querySelector('h1').innerText = "Ожидание...";
                }, 2000);
            } else {
                document.querySelector('h1').innerText = "Код приглашения не найден в ссылке.";
            }
        } else {
            document.getElementById('desktop-warning').style.display = 'block';
        }
    </script>
</body>
</html>
