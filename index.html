<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск калькулятора</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f4f9; color: #333; }
        .btn { display: inline-block; background-color: #007bff; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-size: 18px; margin-top: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1 id="title">Пытаемся запустить калькулятор...</h1>
    
    <div id="fallback" class="hidden">
        <p>Автоматически открыть калькулятор не удалось.</p>
        <p>Нажмите кнопку ниже (сработает в Chrome).</p>
        <!-- Формат intent:// специально для Android -->
        <a href="intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_CALCULATOR;end" class="btn">Открыть калькулятор</a>
    </div>

    <script>
        const isMobile = /Android/i.test(navigator.userAgent);

        if (isMobile) {
            // Эта строка пытается вызвать калькулятор через Android Intent (работает в Chrome)
            window.location.href = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.APP_CALCULATOR;end";

            // Если через 2.5 секунды мы все еще на странице, значит переход не сработал
            setTimeout(() => {
                document.getElementById('title').innerText = "Ожидание...";
                document.getElementById('fallback').classList.remove('hidden');
            }, 2500);
        } else {
            document.getElementById('title').innerText = "Откройте эту страницу на Android-телефоне.";
        }
    </script>
</body>
</html>
