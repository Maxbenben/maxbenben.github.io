<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в Telegram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
        }
        .btn {
            display: inline-block;
            background-color: #0088cc; /* Цвет Telegram */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 20px;
        }
        #fallback {
            display: none; /* Скрыто по умолчанию */
        }
    </style>
</head>
<body>

    <h2>Открываем Telegram...</h2>
    
    <!-- Блок, который появится, если Telegram не установлен -->
    <div id="fallback">
        <p>Если Telegram не открылся автоматически, нажмите кнопку ниже:</p>
        <!-- Вставьте сюда ссылку на ваш APK или RuStore, когда он будет готов -->
        <a href="https://t.me/ваш_ник" class="btn">Открыть Telegram вручную</a>
    </div>

    <script>
        // 1. Настройте здесь вашу ссылку для Telegram
        // Например, чтобы открыть бота: "tg://resolve?domain=имя_бота"
        // Например, чтобы открыть чат по ссылке: "tg://msg_url?url=https://t.me/..."
        var telegramScheme = "tg://resolve?domain=durov"; // Пример: открывает профиль Павла Дурова

        // 2. Пытаемся открыть приложение
        window.location.href = telegramScheme;

        // 3. Если приложение не открылось за 2.5 секунды, показываем кнопку
        setTimeout(function() {
            document.getElementById("fallback").style.display = "block";
            document.querySelector("h2").innerText = "Telegram не найден";
        }, 2500);
    </script>

</body>
</html>
